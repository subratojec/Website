    <script>
        async function fetchTimeline() {
            const container = document.getElementById('timelineScroll');
            const query = '*[_type == "timelineItem"] | order(order asc)';
            const url = getSanityUrl(query);
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.result && data.result.length > 0) {
                    container.innerHTML = data.result.map(item => `
                        <div class="ht-item">
                            <div class="ht-box">
                                <h4>${item.title || ''}</h4>
                                <p>${item.description || ''}</p>
                            </div>
                            <div class="ht-connector"></div>
                            <div class="ht-axis"></div>
                            <div class="ht-year">${item.year || ''}</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p class="empty-state">No timeline items found in CMS yet.</p>';
                }
            } catch (error) {
                console.error("Failed to load timeline items:", error);
                container.innerHTML = '<p class="empty-state">Failed to load timeline items.</p>';
            }
        }
        
        fetchTimeline();
    </script>
